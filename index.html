<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description"
        content="Recall turns slide decks and notes into spaced-repetition study cards with text, fill-in-the-blank, image and audio.">
    <meta name="theme-color" content="#f2f4f7">
    <title>Recall – study by remembering</title>
    <script>try { var t = localStorage.getItem("recall-theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t } catch (e) { }</script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/flow.css">
    <link rel="stylesheet" href="css/themes.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
    <main>
        <header class="top">
            <div class="brand">
                <h1>Recall</h1>
                <p class="tag">Notes in, memory out.</p>
            </div>
            <div class="tools"><select id="deck" aria-label="Deck"></select><button id="acct" type="button">Sign in</button><button
                    id="theme">Theme</button></div>
        </header>
        <nav id="nav"></nav>
        <div id="syncbox"></div>
        <div id="toast" class="toast" role="status" hidden></div>
        <div id="view"></div>
        <div id="sr" role="status"></div>
    </main>

    <script src="js/core.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/account.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/download.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/pace.js"></script>
    <script src="js/cram.js"></script>
    <script src="js/study.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/create.js"></script>
    <script src="js/parsers.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/import-view.js"></script>
    <script src="js/library.js"></script>
    <script src="js/vocab.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
